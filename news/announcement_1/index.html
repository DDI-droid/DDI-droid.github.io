v> </div> </div> </div> <div class="PostsPage-postContent instapaper_body ContentStyles-base content ContentStyles-postBody"> <div class="commentOnSelection"> <div id="postContent"> <div> <div id="markdown-content"> <p>Samay, our time-series foundation model at Kairosity, is Top-3 on the <a href="https://huggingface.co/spaces/Salesforce/GIFT-Eval" rel="external nofollow noopener" target="_blank">GIFT-Eval</a> benchmark, ahead of models from Amazon, IBM, and Google.</p> </div> </div> </div> </div> </div> </div> </div> <div class="MultiToCLayout-rhs" style="grid-area:rhs0"> <div class="PostsPage-reserveSpaceForSidenotes"></div> <div class="SideItems-sidebar"></div> </div> <div class="MultiToCLayout-gap1"></div> <div class="MultiToCLayout-content" style="grid-area:content1"> <div class="PostsPage-centralColumn PostsPage-betweenPostAndComments"> </div> </div> </div> </div> <script src="/assets/js/lw-footnotes.js"></script> <script>
  (() => {
    // Contents rail: one row per heading, each row sized by the length of its section but never shorter
    // than its own text (as on lesswrong.com), a progress bar for the viewport, the current section
    // highlighted, revealed on hover. When the rows are taller than the window the rail scrolls, and it
    // follows the section being read.
    const article = document.getElementById('markdown-content');
    const rows = document.getElementById('toc-rows');
    const toc = document.getElementById('fixed-toc');
    const bar = document.getElementById('toc-progress');
    const headings = [...article.querySelectorAll('h2, h3, h4')];
    if (!headings.length) { toc.hidden = true; return; }
    headings.forEach((h, i) => { if (!h.id) h.id = 'section-' + i; });
    const tops = () => headings.map(h => h.getBoundingClientRect().top + window.scrollY);
    const docEnd = () => article.getBoundingClientRect().bottom + window.scrollY;
    const entries = headings.map(h => {
      const level = Number(h.tagName[1]) - 1;
      const wrap = document.createElement('div');
      wrap.className = 'FixedPositionToC-rowWrapper';
      wrap.innerHTML = '<div class="FixedPositionToC-rowDotContainer"><div class="FixedPositionToC-rowDot">•</div>' +
        '<div class="FixedPositionToC-rowOpacity"><div class="TableOfContentsRow-root TableOfContentsRow-level' + level + '">' +
        '<a class="TableOfContentsRow-link TableOfContentsRow-highlightDot"></a></div></div></div>';
      const link = wrap.querySelector('a');
      link.href = '#' + h.id;
      link.textContent = h.textContent.trim();
      rows.append(wrap);
      return { wrap, row: wrap.querySelector('.TableOfContentsRow-root') };
    });
    const sizeRows = () => {
      const t = tops(), end = docEnd();
      entries.forEach((e, i) => {
        const len = Math.max(1, (i + 1 < t.length ? t[i + 1] : end) - t[i]);
        e.wrap.style.flex = len + ' 1 0px';
      });
    };
    const scroller = toc.closest('.MultiToCLayout-stickyBlockScroller');
    let shown = -1;
    const follow = current => {
      if (current < 0 || current === shown || !scroller || scroller.scrollHeight <= scroller.clientHeight + 1) return;
      shown = current;
      const r = entries[current].wrap.getBoundingClientRect(), s = scroller.getBoundingClientRect();
      if (r.top < s.top + 40 || r.bottom > s.bottom - 40) scroller.scrollTop += r.top - s.top - scroller.clientHeight * 0.3;
    };
    const track = () => {
      const t = tops(), y = window.scrollY, mark = y + window.innerHeight * 0.3;
      let current = -1;
      t.forEach((top, i) => { if (top <= mark) current = i; });
      entries.forEach((e, i) => e.row.classList.toggle('TableOfContentsRow-highlighted', i === current));
      follow(current);
      const first = t[0] || 0, span = Math.max(1, docEnd() - first);
      const h = rows.getBoundingClientRect().height;
      const top = Math.max(0, Math.min(h, (y - first) / span * h));
      const height = Math.max(0, Math.min(h - top, window.innerHeight / span * h));
      bar.style.setProperty('--windowTop', top + 'px');
      bar.style.setProperty('--windowHeight', height + 'px');
    };
    toc.addEventListener('mouseenter', () => toc.classList.add('FixedPositionToC-hover'));
    toc.addEventListener('mouseleave', () => toc.classList.remove('FixedPositionToC-hover'));
    const refresh = () => { sizeRows(); track(); };
    window.addEventListener('scroll', track, { passive: true });
    window.addEventListener('resize', refresh);
    window.addEventListener('load', refresh);
    if (document.fonts) document.fonts.ready.then(refresh);
    refresh();
  })();
</script> </div> </div> </div> </div> </div> </div> <script>
      (() => {
        // Theme toggle.
        const root = document.documentElement;
        const toggle = document.getElementById('theme-toggle');
        const applyTheme = () => {
          const dark = root.getAttribute('data-theme') === 'dark';
          document.body.classList.toggle('theme-dark', dark);
          document.body.classList.toggle('theme-default', !dark);
          toggle.setAttribute('aria-pressed', String(dark));
        };
        applyTheme();
        toggle.addEventListener('click', () => {
          const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
          root.setAttribute('data-theme', next);
          root.setAttribute('data-theme-setting', next);
          try { localStorage.setItem('theme', next); } catch (e) {}
          applyTheme();
        });

        // Headroom: the bar hides on scroll down and returns on scroll up.
        const head = document.getElementById('headroom');
        let lastY = window.scrollY;
        const headroom = () => {
          const y = window.scrollY;
          head.classList.remove('headroom--unfixed', 'headroom--pinned', 'headroom--unpinned', 'headroom--scrolled');
          if (y <= 0) head.classList.add('headroom--unfixed');
          else head.classList.add(y < lastY ? 'headroom--pinned' : 'headroom--unpinned', 'headroom--scrolled');
          lastY = y;
        };
        headroom();
        window.addEventListener('scroll', headroom, { passive: true });

        // Phone menu.
        const menuButton = document.getElementById('menu-toggle');
        const menu = document.getElementById('site-menu');
        const setMenu = open => {
          menu.hidden = !open;
          menuButton.setAttribute('aria-expanded', String(open));
        };
        menuButton.addEventListener('click', e => { e.stopPropagation(); setMenu(menu.hidden); });
        document.addEventListener('click', e => { if (!menu.hidden && !menu.contains(e.target)) setMenu(false); });
        document.addEventListener('keydown', e => { if (e.key === 'Escape') setMenu(false); });

        // Their "Load More" under long lists.
        document.querySelectorAll('[data-page-size]').forEach(list => {
          const size = Number(list.dataset.pageSize);
          const items = [...list.children];
          if (items.length <= size) return;
          let shown = size;
          const more = document.createElement('a');
          more.className = 'LoadMore-root LoadMore-afterPostsListMarginTop';
          more.href = '#';
          const update = () => {
            items.forEach((item, i) => { item.hidden = i >= shown; });
            more.textContent = 'Load More (' + shown + '/' + items.length + ')';
            if (shown >= items.length) more.remove();
          };
          more.addEventListener('click', e => { e.preventDefault(); shown += size; update(); });
          list.after(more);
          update();
        });
      })();
    </script> </body> </html>
