<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Evaluator architecture</title>
  <desc>A Ray scheduler starts one worker per execution. The worker launches an agent container with no internet whose only outbound paths are the LLM shim, which forwards to Bedrock, and the official submission server, which runs grading containers. The final answer file stays locked until the server's record shows a crash, then the worker unlocks it and grades the saved file.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b03a2e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="660" rx="8" fill="#ffffff" stroke="#d9d9d9"/>

  <rect x="20" y="20" width="920" height="130" rx="10" fill="#eef3fb" stroke="#4a6fa5" stroke-width="1.5"/>
  <text x="36" y="44" font-size="15" font-weight="700" fill="#1f3a5f">Evaluator (host) · cybergym-eval</text>

  <rect x="36" y="62" width="190" height="66" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.4"/>
  <text x="131" y="91" font-size="15" text-anchor="middle" fill="#222">Run config</text>
  <text x="131" y="111" font-size="13" text-anchor="middle" fill="#444">+ frozen receipts</text>

  <rect x="262" y="62" width="170" height="66" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.4"/>
  <text x="347" y="91" font-size="15" text-anchor="middle" fill="#222">Ray scheduler</text>
  <text x="347" y="111" font-size="13" text-anchor="middle" fill="#444">K slots at once</text>

  <rect x="488" y="54" width="240" height="66" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.4"/>
  <rect x="480" y="62" width="240" height="66" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.4"/>
  <text x="600" y="89" font-size="15" text-anchor="middle" fill="#222">Worker × K (one per execution)</text>
  <text x="600" y="110" font-size="12.5" text-anchor="middle" fill="#444">gen_task · key · launch · grade</text>

  <rect x="780" y="62" width="140" height="66" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.4"/>
  <text x="850" y="91" font-size="15" text-anchor="middle" fill="#222">SQLite</text>
  <text x="850" y="111" font-size="13" text-anchor="middle" fill="#444">run state</text>

  <line x1="226" y1="95" x2="260" y2="95" stroke="#333" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="432" y1="95" x2="478" y2="95" stroke="#333" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="720" y1="95" x2="778" y2="95" stroke="#333" stroke-width="1.6" marker-end="url(#ah)"/>

  <rect x="20" y="230" width="420" height="380" rx="10" fill="#fff6ea" stroke="#c77d1a" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="36" y="256" font-size="15" font-weight="700" fill="#7a4a0b">Agent container · no internet</text>

  <rect x="40" y="280" width="180" height="66" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.4"/>
  <text x="130" y="309" font-size="15" text-anchor="middle" fill="#222">/workspace</text>
  <text x="130" y="329" font-size="13" text-anchor="middle" fill="#444">task files</text>

  <rect x="240" y="280" width="180" height="66" rx="6" fill="#fdecea" stroke="#b03a2e" stroke-width="1.8"/>
  <text x="330" y="309" font-size="15" text-anchor="middle" fill="#7b241c">/output/poc</text>
  <text x="330" y="329" font-size="13" text-anchor="middle" fill="#7b241c">locked until a crash</text>

  <rect x="40" y="392" width="380" height="60" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.4"/>
  <text x="230" y="418" font-size="15" text-anchor="middle" fill="#222">cg_run supervisor</text>
  <text x="230" y="438" font-size="12.5" text-anchor="middle" fill="#444">deadline per tool call · kills every child process</text>

  <rect x="40" y="520" width="380" height="60" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.4"/>
  <text x="230" y="546" font-size="15" text-anchor="middle" fill="#222">Agent loop</text>
  <text x="230" y="566" font-size="12.5" text-anchor="middle" fill="#444">Codex harness · DeepSeek V3.2 calls</text>

  <line x1="230" y1="520" x2="230" y2="454" stroke="#333" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="240" y="492" font-size="12.5" fill="#333">tool calls</text>

  <line x1="330" y1="392" x2="330" y2="348" stroke="#333" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="322" y="376" font-size="12.5" text-anchor="end" fill="#333">write (denied until unlocked)</text>

  <rect x="520" y="230" width="420" height="380" rx="10" fill="#eef8f6" stroke="#2e8b7a" stroke-width="1.5"/>
  <text x="536" y="256" font-size="15" font-weight="700" fill="#14584c">Host services</text>

  <rect x="540" y="280" width="380" height="180" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.4"/>
  <text x="556" y="304" font-size="14" fill="#222">Submission server · official · :8666</text>
  <rect x="560" y="330" width="340" height="110" rx="6" fill="#f4faf8" stroke="#2e8b7a" stroke-width="1.3"/>
  <text x="730" y="362" font-size="15" font-weight="700" text-anchor="middle" fill="#14584c">Grading containers</text>
  <text x="730" y="386" font-size="12.5" text-anchor="middle" fill="#333">binary-only runners · no network</text>
  <text x="730" y="406" font-size="12.5" text-anchor="middle" fill="#333">one fresh container per submission</text>
  <text x="730" y="426" font-size="12.5" text-anchor="middle" fill="#333">vulnerable build, then fixed build</text>

  <rect x="540" y="520" width="170" height="60" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.4"/>
  <text x="625" y="546" font-size="15" text-anchor="middle" fill="#222">LLM shim</text>
  <text x="625" y="566" font-size="12.5" text-anchor="middle" fill="#444">:4100 · per-run keys</text>

  <rect x="760" y="520" width="160" height="60" rx="6" fill="#f3f3f3" stroke="#777" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="840" y="546" font-size="15" text-anchor="middle" fill="#222">AWS Bedrock</text>
  <text x="840" y="566" font-size="12.5" text-anchor="middle" fill="#444">DeepSeek V3.2</text>

  <line x1="420" y1="550" x2="538" y2="550" stroke="#333" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="428" y="540" font-size="12.5" fill="#333">model requests</text>

  <line x1="420" y1="422" x2="538" y2="422" stroke="#333" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="428" y="412" font-size="12.5" fill="#333">submit.sh (curl)</text>

  <line x1="710" y1="550" x2="758" y2="550" stroke="#333" stroke-width="1.6" marker-end="url(#ah)"/>

  <path d="M510,128 V185 H130 V232" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="140" y="177" font-size="12.5" fill="#333">launch · mount task files + locked /output/poc</text>

  <path d="M540,128 V215 H330 V278" fill="none" stroke="#b03a2e" stroke-width="1.8" marker-end="url(#ahr)"/>
  <text x="338" y="208" font-size="12.5" fill="#b03a2e">unlock after crash confirmed</text>

  <line x1="700" y1="130" x2="700" y2="278" stroke="#333" stroke-width="1.6" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="712" y="186" font-size="12.5" fill="#333">submit saved PoC,</text>
  <text x="712" y="202" font-size="12.5" fill="#333">read verdict</text>

  <text x="480" y="640" font-size="13" font-style="italic" text-anchor="middle" fill="#444">The container has no route out except the two arrows into host services.</text>
</svg>
