    <path d="M270,118 Q165,104 60,118"
      fill="none" stroke="#dc2626" stroke-width="1.6"
      marker-end="url(#swapArrr)"/>
  <text x="165" y="170" font-family="Georgia, 'Times New Roman', serif"
