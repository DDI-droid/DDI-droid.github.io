    <text x="60" y="130" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-style="italic"
      text-anchor="middle" dominant-baseline="central" fill="#B91C1C">c′</text>
  <circle cx="135" cy="130" r="16" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <text x="135" y="130" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-style="italic"
      text-anchor="middle" dominant-baseline="central" fill="#1D4ED8">b₁</text>
  <circle cx="195" cy="130" r="16" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <text x="195" y="130" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-style="italic"
      text-anchor="middle" dominant-baseline="central" fill="#1D4ED8">b₂</text>
  <rect x="256" y="116" width="28" height="28"
      fill="#FEE2E2" stroke="#DC2626" stroke-width="2" rx="2"/>
    <text x="270" y="130" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-style="italic"
      text-anchor="middle" dominant-baseline="central" fill="#B91C1C">c</text>
  <path d="M60,113 Q165,92 270,113"
      fill="none" stroke="#dc2626" stroke-width="1.6"
