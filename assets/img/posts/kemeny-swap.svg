  <!-- divider -->
  <text x="330" y="131" font-family="Georgia, 'Times New Roman', serif" font-size="22"
    text-anchor="middle" dominant-baseline="central" fill="#64748b">&#x2192;</text>

  <!-- panel 2: after swap -->
  <line x1="360" y1="130" x2="630" y2="130"
      stroke="#94a3b8" stroke-width="2"/>
  <rect x="376" y="116" width="28" height="28"
      fill="#FEE2E2" stroke="#DC2626" stroke-width="2" rx="2"/>
    <text x="390" y="130" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-style="italic"
      text-anchor="middle" dominant-baseline="central" fill="#B91C1C">c</text>
  <circle cx="465" cy="130" r="16" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <text x="465" y="130" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-style="italic"
      text-anchor="middle" dominant-baseline="central" fill="#1D4ED8">b₁</text>
  <circle cx="525" cy="130" r="16" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <text x="525" y="130" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-style="italic"
      text-anchor="middle" dominant-baseline="central" fill="#1D4ED8">b₂</text>
  <rect x="586" y="116" width="28" height="28"
      fill="#FEE2E2" stroke="#DC2626" stroke-width="2" rx="2"/>
    <text x="600" y="130" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-style="italic"
      text-anchor="middle" dominant-baseline="central" fill="#B91C1C">c′</text>
  <text x="495" y="170" font-family="Georgia, 'Times New Roman', serif"
