<?xml version="1.0" encoding="UTF-8"?>
<svg width="660" height="230" xmlns="http://www.w3.org/2000/svg">
  <rect width="660" height="230" fill="white"/>
  <defs>
    <marker id="swapArr" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="swapArrr" markerWidth="9" markerHeight="6" refX="1" refY="3" orient="auto">
      <path d="M9,0 L0,3 L9,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <text x="165" y="20" font-family="Georgia, 'Times New Roman', serif" font-size="13"
    text-anchor="middle" fill="#6b7280" font-style="italic">before swap</text>
  <text x="495" y="20" font-family="Georgia, 'Times New Roman', serif" font-size="13"
    text-anchor="middle" fill="#6b7280" font-style="italic">after swap</text>
  <text x="165" y="45" font-family="Georgia, 'Times New Roman', serif" font-size="12"
    text-anchor="middle" fill="#374151">
    <tspan font-style="italic">X</tspan>
    <tspan dx="3">:</tspan>
    <tspan dx="4" font-style="italic">b&#x2081;</tspan>
    <tspan dx="3">&#x227B;</tspan>
    <tspan dx="3" font-style="italic">c</tspan>
    <tspan dx="3">&#x227B;</tspan>
    <tspan dx="3" font-style="italic">b&#x2082;</tspan>
    <tspan dx="3">&#x227B;</tspan>
    <tspan dx="3" font-style="italic">c&#x2032;</tspan>
  </text>

  <!-- panel 1: before swap -->
  <line x1="30" y1="130" x2="300" y2="130"
