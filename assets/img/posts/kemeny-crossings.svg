    <tspan font-style="italic">X</tspan> :
  </text>
  <text x="40" y="155" font-family="Georgia, 'Times New Roman', serif" font-size="15" text-anchor="middle"
    dominant-baseline="central" fill="#444">
    <tspan font-style="italic">R</tspan> :
  </text>

  <!-- caption -->
  <text x="310" y="203" font-family="Georgia, 'Times New Roman', serif" font-size="13"
    text-anchor="middle" dominant-baseline="auto" fill="#555" font-style="italic">
    two crossings, so KT distance&#x202F;=&#x202F;2
